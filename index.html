<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gyeol — K-beauty picked for your skin, at a price you can check.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gyeol Skin-Fit Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: a quiet storefront on hanji paper — sticky header, one working view at a time (home, quiz, results, cart, checkout, survey, team), product detail as a side sheet. */
:root{
  --bg:#F5F0E8;        /* hanji */
  --bg-2:#EAE2D6;      /* deeper hanji */
  --paper:#FBF8F3;     /* card paper */
  --ink:#221E1B;       /* meok ink */
  --ink-soft:#5A524B;
  --ink-mute:#6F665D;
  --clay:#A4574A;      /* seal red-clay accent */
  --clay-soft:#F0DCD6;
  --line:#CDBBA9;
  --ok:#3F6B55;
  --warn:#8A5A12;
  --tile-1:#E6D9C8; --tile-2:#E9D3CC; --tile-3:#D9DDCF; --tile-4:#DCD6E0;
  --display:'Gowun Batang', 'Nanum Myeongjo', Georgia, serif;
  --body:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1916; --bg-2:#26211D; --paper:#231F1B; --ink:#F2EBE1; --ink-soft:#C9BFB3; --ink-mute:#A99E92;
    --clay:#D9927F; --clay-soft:#3A2722; --line:#433A33; --ok:#8CC4A6; --warn:#E0B062;
    --tile-1:#2E2822; --tile-2:#33251F; --tile-3:#262B24; --tile-4:#2A2630; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1916; --bg-2:#26211D; --paper:#231F1B; --ink:#F2EBE1; --ink-soft:#C9BFB3; --ink-mute:#A99E92;
  --clay:#D9927F; --clay-soft:#3A2722; --line:#433A33; --ok:#8CC4A6; --warn:#E0B062;
  --tile-1:#2E2822; --tile-2:#33251F; --tile-3:#262B24; --tile-4:#2A2630; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:clamp(16px,4vw,48px)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--clay)}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:500}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * clamp(16px,4vw,48px));padding:12px clamp(16px,4vw,48px)}
.top .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand .ko{font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--ink)}
.brand .en{font-size:.78rem;letter-spacing:.24em;color:var(--ink-soft)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.navbtn{background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--ink-soft);border-radius:var(--r)}
.navbtn:hover,.navbtn[aria-current="page"]{color:var(--ink);background:var(--bg-2)}
.cartbtn{display:inline-flex;gap:8px;align-items:center}
.pill{display:inline-block;min-width:1.5em;text-align:center;padding:0 .45em;border-radius:99px;background:var(--clay);color:var(--bg);font-size:.8rem;line-height:1.5}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

main{padding-block:32px 72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{background:var(--clay);border-color:var(--clay)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bg-2);color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--ink);border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--clay);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:0;border:1px solid var(--line);background:var(--paper)}
.hero .copy{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:20px;min-width:0}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.6rem)}
.hero .lead{font-size:1.1rem;color:var(--ink-soft);max-width:34em}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.hero .seal{background:var(--bg-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;min-width:0}
.hero .seal .char{font-family:var(--display);font-size:clamp(7rem,16vw,13rem);line-height:1;color:var(--line)}
.hero .seal p{font-size:.9rem;color:var(--ink-soft);text-align:center;max-width:18em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:0;border:1px solid var(--line);border-top:0}
.facts div{padding:18px 24px;border-left:1px solid var(--line);min-width:0}
.facts div:first-child{border-left:0}
.facts b{display:block;font-family:var(--display);font-size:1.5rem}
.section{margin-top:56px;display:flex;flex-direction:column;gap:20px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.section-head h2{font-size:clamp(1.5rem,2.6vw,2rem)}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--paper)}
.why .step{padding:22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.why .step:first-child{border-left:0}
.why .step .date{color:var(--clay);font-size:.85rem;font-weight:500}
.why .step h3{font-size:1.15rem}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.9rem;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);min-width:0;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--ink)}
.tile{aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.4rem;color:#4A423B;position:relative;overflow:hidden}
.tile .cat{color:#5A524B!important}
.tile .illu{position:absolute;left:12px;bottom:10px;font-family:var(--body);font-size:.68rem;color:#6F665D;background:rgba(251,248,243,.75);padding:1px 8px;border-radius:99px;z-index:1}
.pick .tile .illu,.line .tile .illu{display:none}
.tile img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.tile .step{position:absolute;right:10px;top:8px;font-family:var(--body);font-size:.72rem;color:var(--ink-mute);border:1px solid var(--line);border-radius:99px;padding:0 8px;background:var(--paper)}
.searchbox{max-width:320px;width:100%}
.tile .cat{z-index:1;position:absolute;left:12px;top:10px;font-family:var(--body);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .brandname{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)}
.card .pname{font-weight:500;line-height:1.4}
.priceRow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.price{font-family:var(--display);font-size:1.35rem;font-weight:700}
.was{color:var(--ink-mute);text-decoration:line-through;font-size:.9rem}
.save{color:var(--ok);font-size:.85rem;font-weight:600}
.note{font-size:.82rem;color:var(--ink-mute)}
.rare{display:inline-block;font-size:.76rem;font-weight:600;color:var(--ok);border:1px solid var(--ok);border-radius:99px;padding:1px 10px}
.award{display:inline-block;align-self:flex-start;font-size:.76rem;font-weight:500;color:var(--clay);border:1px solid var(--clay);border-radius:99px;padding:1px 10px;margin-top:2px}

/* quiz */
.quiz{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
.progress{height:4px;background:var(--bg-2);border-radius:2px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--clay);transition:width .3s}
.quiz h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{border:1px solid var(--line);background:var(--paper);padding:16px 18px;text-align:left;cursor:pointer;border-radius:var(--r);display:flex;flex-direction:column;gap:2px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay);background:var(--clay-soft)}
.opt b{font-weight:600}
.opt span{font-size:.86rem;color:var(--ink-soft)}
.qnav{display:flex;justify-content:space-between;gap:12px}

/* results */
.results{display:flex;flex-direction:column;gap:20px}
.pick{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:16px}
.pick .tile{aspect-ratio:1/1;font-size:1.8rem}
.pick .why-text{font-size:1.02rem;line-height:1.6}
.pick .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right}
.thinking{padding:40px;text-align:center;border:1px dashed var(--line);color:var(--ink-soft)}
.profile{display:flex;gap:8px;flex-wrap:wrap}
.profile span{background:var(--bg-2);padding:4px 12px;border-radius:99px;font-size:.86rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,14,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;border-left:1px solid var(--line)}
.sheet .close{align-self:flex-end}
.sheet h2{font-size:1.8rem}
table.bd{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.bd td{padding:9px 0;border-bottom:1px solid var(--line)}
table.bd td:last-child{text-align:right}
table.bd tr.total td{border-bottom:2px solid var(--ink);font-weight:600;font-family:var(--display);font-size:1.15rem}
table.bd tr.ref td{color:var(--ink-mute)}
.tariffs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:var(--r)}
.qty button{background:none;border:0;width:36px;height:36px;cursor:pointer}
.qty span{min-width:32px;display:flex;align-items:center;justify-content:center}
.ings{display:flex;gap:6px;flex-wrap:wrap}
.ings span{border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-size:.84rem}

/* cart / checkout */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .tile{aspect-ratio:1/1;font-size:1.1rem}
.summary{background:var(--paper);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.summary .r{display:flex;justify-content:space-between;gap:12px}
.summary .r.total{border-top:2px solid var(--ink);padding-top:12px;font-weight:600;font-family:var(--display);font-size:1.2rem}
form.co{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form.co .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--ink-soft)}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.err{color:var(--clay);font-size:.86rem}
.banner{border:1px solid var(--line);background:var(--bg-2);padding:14px 18px;font-size:.9rem;color:var(--ink-soft)}
.done{max-width:640px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-block:32px}
.done .seal-mark{width:96px;height:96px;border-radius:6px;background:var(--clay);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.4rem}

/* survey */
.survey{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
.likert{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line);background:var(--paper);padding:8px 4px;cursor:pointer;border-radius:var(--r);font-size:.82rem;line-height:1.3}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* team */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;border:1px solid var(--line);background:var(--paper)}
.stats div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table.data{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:var(--bg-2);font-weight:600}
table.data td.r,table.data th.r{text-align:right}
.neg{color:var(--clay);font-weight:600}
.pos{color:var(--ok);font-weight:600}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}

footer.foot{border-top:1px solid var(--line);padding-block:24px 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);z-index:60;font-size:.92rem}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero .seal{padding:20px;flex-direction:row}
  .hero .seal .char{font-size:5rem}
  .why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .why .step:nth-child(3){border-left:0}
  .why .step:nth-child(n+3){border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .pick{grid-template-columns:96px minmax(0,1fr)}
  .pick .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;text-align:left}
}
@media (max-width:560px){
  .facts{grid-template-columns:1fr}
  .facts div{border-left:0;border-top:1px solid var(--line)}
  .facts div:first-child{border-top:0}
  .why{grid-template-columns:1fr}
  .why .step{border-left:0;border-top:1px solid var(--line)}
  .why .step:first-child{border-top:0}
  form.co{grid-template-columns:1fr}
  .line{grid-template-columns:56px minmax(0,1fr) auto}
  .line .lt{grid-column:2/-1;text-align:right}
  nav.main{margin-left:0;width:100%}
  .scale button{font-size:.72rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* hero carousel */
.hero2{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1800/640;min-height:320px;background:#efe6da;margin-top:8px}
.hero2 .slide{position:absolute;inset:0;background-size:cover;background-position:center right;opacity:0;transition:opacity .7s ease;display:flex;align-items:center}
.hero2 .slide.on{opacity:1;z-index:1}
.hero2 .slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,245,238,.94) 0%,rgba(250,245,238,.78) 38%,rgba(250,245,238,0) 62%)}
.slide-copy{word-break:keep-all;position:relative;max-width:520px;padding:0 clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:12px}
.slide-copy .eyebrow{display:inline-block;align-self:flex-start;background:var(--ink,#2b2420);color:#fff;padding:5px 12px;border-radius:999px;font-size:.78rem;letter-spacing:.08em}
.slide-copy h1{font-size:clamp(1.8rem,3.8vw,2.9rem);line-height:1.08;margin:0}
.slide-copy .lead{font-size:clamp(.98rem,1.5vw,1.15rem);margin:0;color:var(--ink-soft,#4a403a)}
.slide-copy .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero2 .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:1.6rem;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hero2 .arrow.prev{left:12px}.hero2 .arrow.next{right:12px}
.hero2 .dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:8px}
.hero2 .dots button{width:9px;height:9px;border-radius:999px;border:0;background:rgba(43,36,32,.3);padding:0;cursor:pointer;transition:width .3s}
.hero2 .dots button[aria-pressed="true"]{width:26px;background:var(--ink,#2b2420)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.pillar{border:1px solid var(--line,#e4dacd);background:var(--paper,#fffaf3);border-radius:14px;padding:12px 10px;font:inherit;cursor:pointer;text-align:center}
.pillar.on{background:var(--ink,#2b2420);color:#fff;border-color:transparent}
/* deals */
.line .tile .deal,.line .tile .cat,.line .tile .illu{display:none}
.tile{position:relative}
.deal{position:absolute;top:10px;right:10px;z-index:2;background:#d9363e;color:#fff;font-weight:800;font-size:.82rem;letter-spacing:.04em;padding:6px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(217,54,62,.35);transform:rotate(3deg)}
.deal-inline{background:#d9363e;color:#fff;font-weight:800;font-size:.8rem;padding:4px 9px;border-radius:7px}
.chip.chip-deal{border-color:#d9363e;color:#b5262d;font-weight:700}
.chip.chip-deal[aria-pressed="true"]{background:#d9363e;color:#fff}
#deals .section-head h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#d9363e;margin-right:10px;vertical-align:middle}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,240px);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.rail .card{scroll-snap-align:start}
.searchbox{padding:9px 14px;border-radius:999px;border:1px solid var(--line,#e4dacd);font:inherit;min-width:0;width:min(260px,100%);background:#fff}
@media (max-width:720px){
 .hero2{aspect-ratio:auto;min-height:500px}
 .hero2 .slide{align-items:flex-end;background-size:auto 62%;background-repeat:no-repeat;background-position:78% 0;background-color:#efe3d0}
 .hero2 .slide::before{background:linear-gradient(0deg,rgba(250,245,238,.97) 0%,rgba(250,245,238,.92) 40%,rgba(250,245,238,0) 52%)}
 .slide-copy{padding:0 18px 40px;gap:8px}
 .hero2 .arrow{display:none}
 .pillars{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){.hero2 .slide{transition:none}}

/* v11: high-contrast banner panels, illustrated pillars, language select */

const byId = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
/* Selection rule: sell only what beats the typical US price by at least minSaving. */
function passes(p){ if(CFG.verifiedOnly && !p.checked) return false; if(p.usNone) return true; return breakdown(p).saving >= CFG.minSaving; }
function shelf(){ return CFG.hideFailing ? PRODUCTS.filter(passes) : PRODUCTS; }
function won(n){ return "₩" + Math.round(n).toLocaleString("en-US"); }

function money(n){ return "$" + (Math.round(n*100)/100).toFixed(2); }
function pct(n){ return (n*100).toFixed(n*100 % 1 ? 1 : 0) + "%"; }
function breakdown(p, rate){
  rate = rate==null ? CFG.tariff : rate;
  const kr = p.krw / CFG.fx;
  const duty = kr * rate;
  const landed = kr + CFG.shipPerUnit + duty;
  const raw = (landed*(1+CFG.margin) + CFG.payFixed) / (1 - CFG.payPct);
  const price = Math.max(Math.ceil(raw*10)/10 - 0.01, 0.99);
  const fee = price*CFG.payPct + CFG.payFixed;
  const margin = price - fee - landed;
  return { kr, krw:p.krw, ship:CFG.shipPerUnit, duty, rate, landed, fee, margin, price, us:p.us, saving: p.usNone ? null : 1 - price/p.us };
}
function amazonPrice(p, rate){
  const b = breakdown(p, rate);
  const target = b.landed*(1+CFG.margin);
  let price = target/(1-0.08);
  if(price > 10) price = target/(1-0.15);
  price = Math.ceil(price) - 0.01;
  const feePct = price > 10 ? 0.15 : 0.08;
  return { price, feePct, saving: p.usNone ? null : 1 - price/p.us };
}

function newsView(){
  const iss = NEWS[0];
  return `<section class="news">
    <div class="news-head">
      <p class="eyebrow">${esc(t("newsTitle"))} · ${esc(t("newsVol"))}${iss.vol} · ${esc(L(iss.week))}</p>
      <h1>${esc(L(iss.title))}</h1>
      <p class="lead">${esc(t("newsLead"))}</p>
      <p class="mock">${esc(t("newsMock"))}</p>
    </div>
    <div class="news-cover" style="background-image:url(${iss.cover})"></div>
    <ol class="stories">${iss.stories.map((s,i)=>`<li class="story">
      <div class="story-no num">${String(i+1).padStart(2,"0")}</div>
      <div class="story-body">
        <span class="story-tag">${esc(L(s.tag))}</span>
        <h2>${esc(L(s.title))}</h2>
        <p class="story-sum">${esc(L(s.sum))}</p>
        <ul class="story-pts">${(s.pts[S.lang]||s.pts.en).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <p class="story-tip"><b>${esc(t("newsTip"))}</b> ${esc(L(s.tip))}</p>
        <div class="story-shop"><span class="small muted">${esc(t("newsShop"))}</span>
          ${s.shop.filter(id=>byId[id]).length ? `<div class="mini-row">${s.shop.filter(id=>byId[id]).map(id=>{const p=byId[id];return `<button class="mini" data-open="${id}" data-src="news">${tile(p,"sm")}<span><b>${esc(p.brand)}</b>${esc(pname(p))}</span><span class="num">${money(breakdown(p).price)}</span></button>`;}).join("")}</div>` : `<p class="small muted">${esc(t("newsNoShelf"))}</p>`}
        </div>
        <p class="story-src small">${esc(t("newsSrc"))}: ${s.src.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join(" · ")}</p>
      </div></li>`).join("")}</ol>
    <p class="note">${esc(t("newsNext"))}</p>
  </section>`;
}

function log(type, data){
  const ev = LS.get("events", []);

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pname(p){ return S.lang==="ko" ? p.ko : (ptxt(p,0) || p.en); }
function pdesc(p){ return S.lang==="ko" ? p.dKo : (ptxt(p,1) || p.dEn); }
function puse(p){ return S.lang==="ko" ? p.useKo : (ptxt(p,2) || p.useEn); }
function cartCount(){ return Object.values(S.cart).reduce((a,b)=>a+b,0); }
const BG = {cleanser:"celadon",toner:"celadon",pad:"celadon",essence:"butter",serum:"butter",ampoule:"butter",cream:"lilac",mask:"lilac",sun:"blush",lip:"blush",tint:"blush"};
function tileBg(p){ return `var(--tile-${p.tone}) url(cat-${p.cat}.jpg) center/cover`; }
const STEP = {cleanser:"1",toner:"2",pad:"2",essence:"3",serum:"3",ampoule:"3",cream:"4",sun:"5",mask:"+",lip:"+",tint:"+"};
const CAT_ORDER = ["cleanser","toner","pad","essence","serum","ampoule","cream","sun","mask","lip","tint"];
/* Product photos: images/<product id>.jpg replaces the vessel illustration automatically when the file exists. */
function tile(p, cls){ return `<div class="tile ${cls||""}" style="background:${tileBg(p)}" aria-hidden="true"><span class="cat">${esc(t("cats")[p.cat])}</span>${dealOf(p)?`<span class="deal">${esc(dealLabel(dealOf(p)))}</span>`:""}<span class="illu">${esc(t("illu"))}</span><img class="ph" src="${p.id}.jpg" alt="" loading="lazy" onload="this.previousElementSibling.remove()" onerror="this.remove()"></div>`; }
function dealOf(p){ const n=p.en; if(/\(1\+1\)/.test(n)) return "1+1"; if(/double|2-pack/i.test(n)) return "2X"; if(/\bset\b/i.test(n)) return "GIFT"; return null; }
function dealLabel(d){ return d==="1+1" ? "1+1" : d==="2X" ? t("dealDouble") : t("dealGift"); }
function priceBlock(p){
  const b = breakdown(p);
  return `<div class="priceRow"><span class="price num">${money(b.price)}</span>${p.usNone?`<span class="rare">${esc(t("rareL"))}</span>`:""}</div>`;
}
function toast(msg){ S.toast = msg; render(); clearTimeout(toast._t); toast._t = setTimeout(()=>{ S.toast=""; render(); }, 2200); }
function go(view){ S.view = view; S.sheet = null; S.confirmClear = false; render(); window.scrollTo({top:0}); }
function saveCart(){ LS.set("cart", S.cart); }

/* ---------- views ---------- */
function header(){
  const nav = [["home",t("shop")],["quiz",t("quiz")],["news",t("news")]];
  return `<header class="top"><div class="wrap row">
    <button class="brand" data-go="home" aria-label="Gyeol home"><span class="ko">결</span><span class="en">GYEOL</span></button>
    <nav class="main" aria-label="Main">
      ${nav.map(([v,l])=>`<button class="navbtn" data-go="${v}" ${S.view===v?'aria-current="page"':''}>${esc(l)}</button>`).join("")}
      <button class="navbtn cartbtn" data-go="cart" ${S.view==="cart"?'aria-current="page"':''}>${esc(t("cart"))} <span class="pill num">${cartCount()}</span></button>
    </nav>
    <label class="langsel"><span class="globe" aria-hidden="true">🌐</span><span class="sr">${esc(t("langL"))}</span>
      <select data-langsel aria-label="${esc(t("langL"))} / Language">${LANGS.map(([v,l])=>`<option value="${v}" ${S.lang===v?"selected":""}>${l}</option>`).join("")}</select>
    </label>
  </div></header>`;
}

const SLIDES = ["rare","real","idol","youtube"];
const LANGS = [["en","English"],["ko","한국어"],["zh","中文 (简体)"],["ja","日本語"]];
function homeView(){
  const cats = ["all", "deals", ...CAT_ORDER.filter(c=>shelf().some(p=>p.cat===c))];
  const deals = shelf().filter(dealOf);
  const i = S.slide % SLIDES.length, k = SLIDES[i];
  return `
  <section class="hero2" aria-roledescription="carousel" aria-label="${esc(t("bannerAria"))}">
    ${SLIDES.map((key,j)=>`<div class="slide s-${key} ${j===i?"on":""}" style="background-image:url(banner-${key}.jpg)" aria-hidden="${j!==i}"><img class="slide-photo" src="hero-${key}.jpg" alt="" onload="this.parentNode.classList.add('has-photo')" onerror="this.remove()"><img class="slide-art" src="pillar-${key}.svg" alt="" loading="lazy">
      <div class="slide-copy">
        <p class="eyebrow">${esc(t("b_"+key+"_eyebrow"))}</p>
        <h1>${esc(t("b_"+key+"_title"))}</h1>
        <p class="lead">${esc(t("b_"+key+"_lead"))}</p>
        <div class="actions"><button class="btn" data-scroll="products" tabindex="${j===i?0:-1}">${esc(t("shopNow"))}</button><button class="btn ghost" data-go="quiz" tabindex="${j===i?0:-1}">${esc(t("startQuiz"))}</button></div>
      </div></div>`).join("")}
    <button class="arrow prev" data-slide="-1" aria-label="${esc(t("prev"))}">‹</button>
    <button class="arrow next" data-slide="1" aria-label="${esc(t("next"))}">›</button>
    <div class="dots">${SLIDES.map((key,j)=>`<button data-dot="${j}" aria-label="${esc(t("b_"+key+"_eyebrow"))}" aria-pressed="${j===i}"></button>`).join("")}</div>
  </section>
  <div class="pillars">${SLIDES.map((key,j)=>`<button class="pillar p-${key} ${j===i?"on":""}" data-dot="${j}"><img src="theme-${key}.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='pillar-${key}.svg'"><b>${esc(t("b_"+key+"_eyebrow"))}</b></button>`).join("")}</div>
  ${deals.length?`<section class="section" id="deals">
    <div class="section-head"><h2>${esc(t("dealsTitle"))}</h2><span class="muted small">${esc(t("dealsSub"))}</span></div>
    <div class="rail">${deals.map(card).join("")}</div>
  </section>`:""}
  <section class="section" id="products">
    <div class="section-head"><h2>${esc(t("allProducts"))}</h2>
      <input id="search" class="searchbox" type="search" placeholder="${esc(t("search"))}" value="${esc(S.q||"")}" aria-label="${esc(t("search"))}">
    </div>
    <div class="filters" role="group" aria-label="Category">${cats.map(c=>`<button class="chip ${c==="deals"?"chip-deal":""}" data-filter="${c}" aria-pressed="${S.filter===c}">${esc(c==="all"?t("all"):c==="deals"?t("dealsChip"):t("cats")[c])}</button>`).join("")}</div>
    <div id="gridArea">${gridHtml()}</div>
    <p class="note">${esc(t("priceNote"))}</p>
  </section>`;
}
function gridHtml(){
  const q = (S.q||"").trim().toLowerCase();
  const list = shelf().filter(p=>(S.filter==="all"||(S.filter==="deals"?!!dealOf(p):p.cat===S.filter)) && (!q || (p.brand+" "+p.en+" "+p.ko+" "+(PX[p.id]?PX[p.id].zh[0]+" "+PX[p.id].ja[0]:"")+" "+t("cats")[p.cat]).toLowerCase().includes(q)))
    .sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat));
  return list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="muted">${esc(t("noMatch"))}</p>`;
}
function card(p){
  return `<button class="card" data-open="${p.id}" data-src="grid">${tile(p)}
    <div class="info"><span class="brandname">${esc(p.brand)}</span><span class="pname">${esc(pname(p))}</span><span class="small muted">${esc(p.size)} · ${esc(t("stepL"))} ${STEP[p.cat]}</span>${p.award?`<span class="award">★ ${esc(p.award.replace("Olive Young Awards","OY Awards"))}</span>`:""}${priceBlock(p)}</div></button>`;
}

function quizView(){
  const qs = t("q"), i = S.quizStep, q = qs[i];
  const val = S.answers[q.k];
  const chosen = v => q.multi ? val.includes(v) : val===v;
  const canNext = q.multi ? val.length>0 : val!=null;
  return `<section class="quiz">
    <div class="progress" aria-hidden="true"><span style="width:${((i+1)/qs.length)*100}%"></span></div>
    <p class="eyebrow">${esc(t("step"))} ${i+1} ${esc(t("of"))} ${qs.length}</p>
    <h2>${esc(q.t)}</h2>
    ${q.multi?`<p class="muted small">${esc(t("pickUpTo"))}</p>`:""}
    <div class="opts">${q.o.map(([v,l,s])=>`<button class="opt" data-ans="${v}" aria-pressed="${chosen(v)}"><b>${esc(l)}</b>${s?`<span>${esc(s)}</span>`:""}</button>`).join("")}</div>
    <div class="qnav">
      <button class="btn ghost" data-qback ${i===0?"disabled":""}>${esc(t("back"))}</button>
      <button class="btn" data-qnext ${canNext?"":"disabled"}>${esc(i===qs.length-1?t("seeResults"):t("next"))}</button>
    </div>
  </section>`;
}

function profileChips(){
  const qs = t("q"); const out=[];
  qs.forEach(q=>{ const v = S.answers[q.k]; const vals = Array.isArray(v)?v:[v];
    vals.forEach(x=>{ const o = q.o.find(o=>o[0]===x); if(o) out.push(o[1]); }); });
  return out.length? `<div class="profile">${out.map(x=>`<span>${esc(x)}</span>`).join("")}</div>` : "";
}
function resultsView(){
  if(S.thinking) return `<section class="results"><p class="eyebrow">${esc(t("yourPicks"))}</p><div class="thinking">${esc(t("thinking"))}</div></section>`;
  if(!S.picks) { return quizView(); }
  return `<section class="results">
    <div class="section-head"><h2>${esc(t("yourPicks"))}</h2><button class="btn ghost sm" data-retake>${esc(t("retake"))}</button></div>
    ${profileChips()}
    ${S.picks.map(pk=>{ const p = byId[pk.id]; const reason = pk[S.lang] || pk.en || pk.ko || "";
      return `<article class="pick">${tile(p)}
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="card-brand eyebrow" style="color:var(--ink-mute)">${esc(p.brand)}</span><h3 style="font-size:1.25rem">${esc(pname(p))}</h3><p class="why-text">${esc(reason)}</p></div>
        <div class="side">${priceBlock(p)}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-open="${p.id}" data-src="pick">${esc(t("view"))}</button><button class="btn sm" data-add="${p.id}" data-src="pick">${esc(t("addToCart"))}</button></div></div>
      </article>`; }).join("")}
    <p class="note">${esc(S.pickSource==="ai"? t("aiNote") : t("ruleNote"))}</p>
  </section>`;
}

function sheetView(){
  const p = byId[S.sheet]; if(!p) return "";
  const b = breakdown(p);
  const bd = `<div class="priceRow"><span class="price num" style="font-size:1.9rem">${money(b.price)}</span>${dealOf(p)?`<span class="deal-inline">${esc(dealLabel(dealOf(p)))}</span>`:""}${p.usNone?`<span class="rare">${esc(t("rareL"))}</span>`:""}</div>`;
  return `<div class="scrim" data-close></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(pname(p))}">
    <button class="btn ghost sm close" data-close>✕</button>
    ${tile(p)}
    <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow" style="color:var(--ink-mute)">${esc(p.brand)}</span><h2>${esc(pname(p))}</h2>${bd}<p class="muted">${esc(pdesc(p))}</p>${p.award?`<p class="award">★ ${esc(p.award)}</p>`:""}<p class="small muted">${esc(t("sizeL"))} ${esc(p.size)} · ${esc(t("stepL"))} ${STEP[p.cat]}</p></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="small muted">${esc(t("howTo"))}</span><p>${esc(puse(p))}</p></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="small muted">${esc(t("fits"))}</span><div class="ings">${p.skin.map(s=>`<span>${esc(t("skinNames")[s])}</span>`).join("")}</div></div>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="small muted">${esc(t("keyIng"))}</span><div class="ings">${p.ing.map(s=>`<span>${esc(s)}</span>`).join("")}</div></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="qty"><button data-sq="-1" aria-label="Less">−</button><span class="num">${S.sheetQty}</span><button data-sq="1" aria-label="More">+</button></div>
      <button class="btn" data-add="${p.id}" data-src="sheet">${esc(t("addToCart"))}</button>
    </div>
  </aside>`;
}

/* State base sales tax rates (no local add-ons). Final tax is set at payment by address. */
const STATE_TAX = {AL:.04,AK:0,AZ:.056,AR:.065,CA:.0725,CO:.029,CT:.0635,DE:0,DC:.06,FL:.06,GA:.04,HI:.04,ID:.06,IL:.0625,IN:.07,IA:.06,KS:.065,KY:.06,LA:.05,ME:.055,MD:.06,MA:.0625,MI:.06,MN:.06875,MS:.07,MO:.04225,MT:0,NE:.055,NV:.0685,NH:0,NJ:.06625,NM:.04875,NY:.04,NC:.0475,ND:.05,OH:.0575,OK:.045,OR:0,PA:.06,RI:.07,SC:.06,SD:.042,TN:.07,TX:.0625,UT:.0485,VT:.06,VA:.053,WA:.065,WV:.06,WI:.05,WY:.04};
function taxState(){ return S.taxState || LS.get("coDraft",{}).state || "CA"; }
function totals(){
  let sub = 0; for(const [id,q] of Object.entries(S.cart)){ if(byId[id]) sub += breakdown(byId[id]).price*q; }
  const st = taxState(), rate = STATE_TAX[st] ?? 0, tax = Math.round(sub*rate*100)/100;
  return { sub, tax, rate, st, total: sub+tax };
}
function cartView(){
  const lines = Object.entries(S.cart).filter(([id,q])=>byId[id]&&q>0);
  if(!lines.length) return `<section class="done"><h2>${esc(t("empty"))}</h2><p class="muted">${esc(t("emptyHint"))}</p><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn" data-go="quiz">${esc(t("startQuiz"))}</button><button class="btn ghost" data-go="home">${esc(t("browse"))}</button></div></section>`;
  const tt = totals();
  return `<section class="section" style="margin-top:0">
    <div class="section-head"><h2>${esc(t("cartTitle"))}</h2><span class="muted num">${cartCount()} ${esc(t("items"))}</span></div>
    <div class="two">
      <div>${lines.map(([id,q])=>{ const p=byId[id]; const pr=breakdown(p).price; return `<div class="line">${tile(p)}
        <div style="min-width:0"><div class="small muted">${esc(p.brand)}</div><div>${esc(pname(p))}</div><button class="linkbtn small" data-rm="${id}">${esc(t("remove"))}</button></div>
        <div class="qty"><button data-cq="${id}" data-d="-1" aria-label="Less">−</button><span class="num">${q}</span><button data-cq="${id}" data-d="1" aria-label="More">+</button></div>
        <div class="lt num">${money(pr*q)}</div></div>`; }).join("")}</div>
      ${summaryBox(tt, `<button class="btn" data-go="checkout">${esc(t("checkout"))}</button>`, true)}
    </div>
  </section>`;
}
function summaryBox(tt, action, withPicker){
  return `<aside class="summary">
    <div class="r"><span>${esc(t("subtotal"))}</span><span class="num">${money(tt.sub)}</span></div>
    <div class="r"><span>${esc(t("tax"))} <span class="small muted">(${esc(tt.st)} ${(tt.rate*100).toFixed(tt.rate*1000%1?3:2).replace(/0+$/,"").replace(/\.$/,"")}%)</span></span><span class="num">${money(tt.tax)}</span></div>
    ${withPicker?`<label class="small" for="tax-state">${esc(t("shipTo"))}<select id="tax-state" data-taxstate>${STATES.map(x=>`<option ${tt.st===x?"selected":""}>${x}</option>`).join("")}</select></label>`:""}
    <div class="r total"><span>${esc(t("total"))}</span><span class="num">${money(tt.total)}</span></div>
    <p class="note">${esc(t("taxNote"))}</p>
    ${action||""}
  </aside>`;
}
const STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
function checkoutView(){
  if(!cartCount()) return cartView();
  const e = S.coErrors, d = LS.get("coDraft", {});
  const f = (id, label, type, cls) => `<label class="${cls||""}" for="co-${id}">${esc(label)}<input id="co-${id}" name="${id}" type="${type||"text"}" value="${esc(d[id]||"")}" autocomplete="${({name:"name",email:"email",addr:"street-address",city:"address-level2",zip:"postal-code"})[id]||"on"}">${e[id]?`<span class="err">${esc(e[id])}</span>`:""}</label>`;
  return `<section class="section" style="margin-top:0">
    <div class="section-head"><h2>${esc(t("coTitle"))}</h2></div>
    <p class="banner">${esc(t("protoBanner"))}</p>
    <div class="two">
      <form class="co" id="coForm" novalidate>
        <p class="full muted">${esc(t("coLead"))}</p>
        ${f("name",t("name"),"text","full")}
        ${f("email",t("email"),"email","full")}
        ${f("addr",t("addr"),"text","full")}
        ${f("city",t("city"))}
        <label for="co-state">${esc(t("state"))}<select id="co-state" name="state" data-taxstate>${STATES.map(s=>`<option ${ taxState()===s?"selected":""}>${s}</option>`).join("")}</select></label>
        ${f("zip",t("zip"))}
        <div class="full" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
          <button class="btn" type="submit">${esc(t("placeOrder"))}</button>
          <button class="btn ghost" type="button" disabled title="${esc(t("stripeSoon"))}">${esc(t("stripeTest"))}</button>
          <span class="note">${esc(t("stripeSoon"))}</span>
        </div>
      </form>
      ${summaryBox(totals())}
    </div>
  </section>`;
}
function doneView(){
  const o = S.lastOrder; if(!o) return homeView();
  return `<section class="done">
    <div class="seal-mark">결</div>
    <h2>${esc(t("thanks"))}</h2>
    <p class="muted">${esc(t("orderNo"))} <b class="num">${esc(o.no)}</b></p>
    <p>${esc(t("doneLead"))} <b>${esc(o.email)}</b> ${esc(t("doneLead2"))}</p>
    <p class="banner">${esc(t("protoBanner"))}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn" data-go="survey">${esc(t("giveFeedback"))}</button><button class="btn ghost" data-go="home">${esc(t("keepShopping"))}</button></div>
  </section>`;
}

function surveyView(){
  const block = (head, key, arr) => `<div><h3 style="font-size:1.25rem;margin-bottom:4px">${esc(head)}</h3>${arr.map((s,i)=>{ const id=key+(i+1); const v=S.survey[id];
    return `<div class="likert"><span>${i+1}. ${esc(s)}</span><div class="scale" role="group" aria-label="${esc(s)}">${t("sa").map((l,j)=>`<button data-sv="${id}" data-v="${j+1}" aria-pressed="${v===j+1}">${esc(l)}</button>`).join("")}</div></div>`; }).join("")}</div>`;
  return `<section class="survey">
    <div><p class="eyebrow">${esc(t("giveFeedback"))}</p><h2 style="font-size:clamp(1.6rem,3.4vw,2.3rem)">${esc(t("svTitle"))}</h2><p class="muted" style="margin-top:8px">${esc(t("svLead"))}</p></div>
    ${block(t("svSusHead"),"sus",t("sus"))}
    ${block(t("svTrustHead"),"trust",t("trust"))}
    ${block(t("svIntentHead"),"intent",t("intent"))}
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" data-svsubmit>${esc(t("submit"))}</button>${S.svErr?`<span class="err">${esc(t("svMissing"))}</span>`:""}</div>
  </section>`;
}
function susScore(r){ let s=0; for(let i=1;i<=10;i++){ const v=r["sus"+i]; s += (i%2 ? v-1 : 5-v); } return s*2.5; }
function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }

function teamView(){
  const ev = LS.get("events", []), orders = LS.get("orders", []), sv = LS.get("surveys", []);
  const c = type => ev.filter(e=>e.type===type).length;
  const cg = (type,g) => ev.filter(e=>e.type===type && e.group===g).length;
  const susBy = g => mean(sv.filter(r=>r.group===g).map(r=>r.sus));
  const trustBy = g => mean(sv.filter(r=>r.group===g).map(r=>r.trust));
  const f1 = n => n==null ? "–" : n.toFixed(1);
  const statRows = [["quiz_done",t("sessions")],["pick_click",t("clicks")],["breakdown_view",t("views")],["add_to_cart",t("carts")],["order",t("orders")]];
  return `<section class="section" style="margin-top:0">
    <div class="section-head"><div><p class="eyebrow">Team 12</p><h2>${esc(t("teamTitle"))}</h2></div>
      <div class="filters" role="group" aria-label="${esc(t("group"))}"><span class="small muted" style="align-self:center">${esc(t("group"))}</span>
        <button class="chip" data-group="A" aria-pressed="${S.group==="A"}">${esc(t("groupA"))}</button>
        <button class="chip" data-group="B" aria-pressed="${S.group==="B"}">${esc(t("groupB"))}</button></div>
    </div>
    <p class="muted">${esc(t("teamLead"))}</p>
    <p class="banner">${esc(t("protoBanner"))}</p>
    <div class="stats">
      ${statRows.map(([k,l])=>`<div><span class="small muted">${esc(l)}</span><b>${c(k)}</b><span class="small muted num">A ${cg(k,"A")} · B ${cg(k,"B")}</span></div>`).join("")}
      <div><span class="small muted">${esc(t("surveys"))}</span><b>${sv.length}</b><span class="small muted num">A ${sv.filter(r=>r.group==="A").length} · B ${sv.filter(r=>r.group==="B").length}</span></div>
      <div><span class="small muted">${esc(t("avgSus"))}</span><b>${f1(mean(sv.map(r=>r.sus)))}</b><span class="small muted num">A ${f1(susBy("A"))} · B ${f1(susBy("B"))}</span></div>
      <div><span class="small muted">Trust (1–5)</span><b>${f1(mean(sv.map(r=>r.trust)))}</b><span class="small muted num">A ${f1(trustBy("A"))} · B ${f1(trustBy("B"))}</span></div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>${esc(t("priceModel"))}</h2><button class="btn ghost sm" data-cfgreset>${esc(t("reset"))}</button></div>
    <div class="cfg">

/* ---------- recommendation ---------- */
function ruleScore(p, a){
  let s = 0;
  if(a.skin && p.skin.includes(a.skin)) s += 3;
  a.concern.forEach(c=>{ if(p.concern.includes(c)) s += 4; });
  if(a.texture && a.texture!=="any" && p.texture===a.texture) s += 1;
  if(p.usNone) s += 0.5; if(p.award) s += 0.3;
  const price = breakdown(p).price;
  if(a.budget==="15" && price>=15) s -= 3;
  if(a.budget==="25" && price>25) s -= 3;
  if(a.routine==="minimal" && ["sun","essence","serum"].includes(p.cat)) s += 1;
  if(a.routine==="full" && ["mask","pad","toner","ampoule"].includes(p.cat)) s += 1;
  if(a.routine==="balanced" && ["toner","cream","serum"].includes(p.cat)) s += 1;
  return s;
}
function rulePicks(a){
  const ranked = shelf().map(p=>({p, s:ruleScore(p,a)})).sort((x,y)=>y.s-x.s).slice(0,3);
  return ranked.map(({p})=>{
    const skinEn = a.skin? T.en.skinNames[a.skin].toLowerCase() : "", skinKo = a.skin? T.ko.skinNames[a.skin] : "";
    const hit = a.concern.filter(c=>p.concern.includes(c));
    const cEn = hit.map(c=>T.en.q[1].o.find(o=>o[0]===c)[1].toLowerCase()).join(" and ");
    const cKo = hit.map(c=>T.ko.q[1].o.find(o=>o[0]===c)[1]).join(", ");
    return { id:p.id,
      en: hit.length ? `Chosen for ${cEn}, and it suits ${skinEn} skin. ${p.dEn}` : `A gentle all-rounder that suits ${skinEn} skin. ${p.dEn}`,
      ko: hit.length ? `${cKo} 고민에 맞춰 골랐고, ${skinKo} 피부에도 잘 맞아요. ${p.dKo}` : `${skinKo} 피부에 무난하게 잘 맞는 제품이에요. ${p.dKo}`,
      zh: (()=>{ const sk=a.skin?T.zh.skinNames[a.skin]:"", c=hit.map(c=>T.zh.q[1].o.find(o=>o[0]===c)[1]).join("、"), d=(PX[p.id]&&PX[p.id].zh[1])||p.dEn; return hit.length ? `根据你的「${c}」需求挑选，也适合${sk}肌肤。${d}` : `温和百搭，适合${sk}肌肤。${d}`; })(),
      ja: (()=>{ const sk=a.skin?T.ja.skinNames[a.skin]:"", c=hit.map(c=>T.ja.q[1].o.find(o=>o[0]===c)[1]).join("・"), d=(PX[p.id]&&PX[p.id].ja[1])||p.dEn; return hit.length ? `「${c}」のお悩みに合わせて選びました。${sk}肌にもおすすめです。${d}` : `${sk}肌に合う、やさしいオールラウンダーです。${d}`; })() };
  });
}
async function recommend(){
  const a = JSON.parse(JSON.stringify(S.answers));
  S.thinking = true; S.view = "results"; render(); window.scrollTo({top:0});
  log("quiz_done", { answers:a });
  let picks = null, source = "rules";
  try{
    const sample = window.claude ? await window.claude.use("sample") : null;
    if(sample){
      const catalog = shelf().map(p=>({ id:p.id, brand:p.brand, name:p.en, cat:p.cat, skin:p.skin, targets:p.concern, texture:p.texture, usd:breakdown(p).price, award:p.award?1:0, koreaOnly:p.usNone?1:0, deal:dealOf(p)||"" }));
      const prompt = `You are the product advisor for Gyeol, a small K-beauty store. Pick exactly 3 different products for this shopper, ONLY from the catalog below (use the exact "id" values).
Shopper answers: ${JSON.stringify(a)}
(budget "15" = under $15 per item, "25" = $15 to $25, "any" = no limit; routine = how many steps they like; concern = what they want to improve.)
Catalog: ${JSON.stringify(catalog)}
Rules: our store sells Korean favorites that are hard to find in the US, so when two products fit equally, prefer koreaOnly=1; respect the budget where you can; match skin type and concerns first; no medical or treatment claims; each reason is one or two plain sentences (max 30 words) that mention why it fits THEIR answers.
Reply with only JSON: {"picks":[{"id":"...","en":"reason in English","ko":"같은 이유를 자연스러운 한국어로","zh":"同样的理由，用自然的简体中文","ja":"同じ理由を自然な日本語で"}]}`;
      const out = await sample.json(prompt, { modelTier:"quick" });
      const arr = out && Array.isArray(out.picks) ? out.picks : [];
      const seen = new Set(); const clean = [];
      arr.forEach(x=>{ const id = String(x && x.id || ""); if(byId[id] && !seen.has(id)){ seen.add(id); clean.push({ id, en:String(x.en||""), ko:String(x.ko||""), zh:String(x.zh||""), ja:String(x.ja||"") }); } });
      if(clean.length >= 3){ picks = clean.slice(0,3); source = "ai"; }
      else if(clean.length){ const fill = rulePicks(a).filter(r=>!seen.has(r.id)); picks = clean.concat(fill).slice(0,3); source = "ai"; }
    }
  }catch(e){ /* fall back to rules: not_granted, rate_limited, invalid_json, etc. */ }
  if(!picks) picks = rulePicks(a);
  S.picks = picks; S.pickSource = source; S.thinking = false;
  LS.set("picks", picks); LS.set("pickSource", source);
  log("recommend", { source, ids:picks.map(p=>p.id) });
  render();
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const el = e.target.closest("button, [data-close]"); if(!el) return;
  const d = el.dataset;
  if(d.go){ if(d.go==="why"){ go("home"); setTimeout(()=>document.getElementById("why")?.scrollIntoView({behavior:"smooth"}),30); return; }
    if(d.go==="quiz" && S.picks && S.view!=="results" && el.closest("header")){ go("results"); return; }
    if(d.go==="quiz"){ S.quizStep = 0; } go(d.go); if(d.go==="checkout") log("checkout_start"); return; }
  if(d.slide){ showSlide(S.slide + Number(d.slide), Number(d.slide)); S.slideHold = Date.now()+5000; return; }
  if(d.dot!=null){ const n=Number(d.dot); showSlide(n, n>S.slide?1:-1); S.slideHold = Date.now()+5000; return; }
  if(d.lang){ S.lang = d.lang; LS.set("lang", S.lang); render(); return; }
  if(d.scroll){ document.getElementById(d.scroll)?.scrollIntoView({behavior:"smooth"}); return; }
  if(d.filter){ S.filter = d.filter; document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.filter===S.filter))); const g=document.getElementById("gridArea"); if(g) g.innerHTML = gridHtml(); else render(); return; }
  if(d.ans!=null){ const q = T.en.q[S.quizStep];
    if(q.multi){ const arr = S.answers[q.k]; const i = arr.indexOf(d.ans); if(i>=0) arr.splice(i,1); else { arr.push(d.ans); if(arr.length>2) arr.shift(); } }
    else S.answers[q.k] = d.ans;
    render(); return; }
  if(el.hasAttribute("data-qback")){ if(S.quizStep>0){ S.quizStep--; render(); } return; }
  if(el.hasAttribute("data-qnext")){ if(S.quizStep < T.en.q.length-1){ S.quizStep++; render(); window.scrollTo({top:0}); } else recommend(); return; }
  if(el.hasAttribute("data-retake")){ S.picks=null; S.answers={skin:null,concern:[],budget:null,routine:null,texture:null}; S.quizStep=0; LS.set("picks",null); go("quiz"); return; }
  if(d.open){ S.sheet = d.open; S.sheetRate = null; S.sheetQty = 1; if(d.src==="pick") log("pick_click",{id:d.open}); log("product_view",{id:d.open, src:d.src}); if(showBreakdown()) log("breakdown_view",{id:d.open}); render(); return; }
  if(el.hasAttribute("data-close")){ S.sheet = null; render(); return; }
  if(d.rate!=null){ S.sheetRate = Number(d.rate); log("tariff_toggle",{id:S.sheet, rate:S.sheetRate}); render(); return; }
  if(d.sq){ S.sheetQty = Math.max(1, Math.min(9, S.sheetQty + Number(d.sq))); render(); return; }
  if(d.add){ const q = d.src==="sheet" ? S.sheetQty : 1; S.cart[d.add] = (S.cart[d.add]||0) + q; saveCart(); log("add_to_cart",{id:d.add, q, src:d.src}); if(d.src==="sheet") S.sheet=null; toast(t("added")); return; }
  if(d.cq){ const n = (S.cart[d.cq]||0) + Number(d.d); if(n<=0) delete S.cart[d.cq]; else S.cart[d.cq] = Math.min(n,9); saveCart(); render(); return; }
  if(d.rm){ delete S.cart[d.rm]; saveCart(); render(); return; }
  if(d.sv){ S.survey[d.sv] = Number(d.v); S.svErr=false; render(); return; }
  if(el.hasAttribute("data-svsubmit")){
    const keys = [...Array(10)].map((_,i)=>"sus"+(i+1)).concat(["trust1","trust2","trust3","intent1","intent2"]);
    if(keys.some(k=>!S.survey[k])){ S.svErr = true; render(); return; }
    const r = Object.assign({}, S.survey);
    const row = { at:new Date().toISOString(), group:S.group, lang:S.lang, answers:r, sus:susScore(r), trust:mean([r.trust1,r.trust2,r.trust3]), intent:mean([r.intent1,r.intent2]) };
    const sv = LS.get("surveys", []); sv.push(row); LS.set("surveys", sv); log("survey",{sus:row.sus});
    S.survey = {}; go("home"); toast(t("svThanks")); return; }
  if(d.group){ S.group = d.group; LS.set("group", S.group); log("group_switch",{to:S.group}); render(); return; }
  if(el.hasAttribute("data-cfgreset")){ CFG = Object.assign({}, DEFAULT_CFG); LS.set("cfg3", {}); render(); return; }
  if(el.hasAttribute("data-export")){
    const payload = { exportedAt:new Date().toISOString(), group:S.group, config:CFG, events:LS.get("events",[]), orders:LS.get("orders",[]), surveys:LS.get("surveys",[]) };
    if(!window.claude){ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"})); a.download="gyeol-research-data.json"; document.body.appendChild(a); a.click(); a.remove(); toast(t("exported")); }catch(err){ toast(t("exportFail")); } return; }
    try{ const dl = window.claude ? await window.claude.use("downloads") : null; if(!dl) throw 0;
      await dl.save({ filename:"gyeol-research-data.json", data:JSON.stringify(payload,null,2) }); toast(t("exported")); }
    catch(err){ if(!(err && err.code==="declined")) toast(t("exportFail")); }
    return; }
  if(el.hasAttribute("data-clear")){ S.confirmClear = true; render(); return; }
  if(el.hasAttribute("data-clearno")){ S.confirmClear = false; render(); return; }
  if(el.hasAttribute("data-clearyes")){ ["events","orders","surveys"].forEach(k=>LS.set(k,[])); S.confirmClear=false; toast(t("cleared")); return; }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.langsel!=null){ S.lang = el.value; LS.set("lang", S.lang); render(); return; }
  if(el.dataset && el.dataset.taxstate!=null){ S.taxState = el.value; const d=LS.get("coDraft",{}); d.state=el.value; LS.set("coDraft", d); render(); return; } if(!el.dataset || !el.dataset.cfg) return;
  const v = Number(el.value); if(!isFinite(v) || v<0) return;
  CFG[el.dataset.cfg] = v; const saved = LS.get("cfg3", {}); saved[el.dataset.cfg] = v; LS.set("cfg3", saved); render();
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.id==="search"){ S.q = el.value; const g=document.getElementById("gridArea"); if(g) g.innerHTML = gridHtml(); return; } if(!el.closest || !el.closest("#coForm")) return;
  const d = LS.get("coDraft", {}); d[el.name] = el.value; LS.set("coDraft", d);
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="coForm") return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  const err = {};
  ["name","email","addr","city","zip"].forEach(k=>{ if(!String(fd[k]||"").trim()) err[k] = t("required"); });
  if(fd.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fd.email)) err.email = t("badEmail");
  if(fd.zip && !/^\d{5}(-\d{4})?$/.test(fd.zip.trim())) err.zip = t("badZip");
  S.coErrors = err; LS.set("coDraft", fd);
  if(Object.keys(err).length){ render(); return; }
  const tt = totals();
  const no = "GY-" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  const order = { no, at:new Date().toISOString(), group:S.group, items:Object.entries(S.cart).map(([id,q])=>({id,q,price:breakdown(byId[id]).price})), subtotal:tt.sub, tax:tt.tax, taxRate:tt.rate, total:tt.total, state:fd.state, email:fd.email };
  const orders = LS.get("orders", []); orders.push(order); LS.set("orders", orders);
  log("order",{ no, total:tt.total, items:order.items.length });
  S.cart = {}; saveCart(); LS.set("coDraft", {}); S.lastOrder = order; go("done");
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.sheet){ S.sheet=null; render(); } });

if(S.picks && !S.picks.every(p=>byId[p.id])) S.picks = null;
log("visit");
render();
const EASE = matchMedia("(prefers-reduced-motion: reduce)").matches ? "transform .35s ease" : "transform .9s cubic-bezier(.65,0,.35,1)";
function showSlide(n, dir){
  const els=[...document.querySelectorAll(".hero2 .slide")]; n=(n+SLIDES.length)%SLIDES.length;
  const old=S.slide; if(n===old) return; S.slide=n;
  if(!els.length) return;
  dir = dir || 1;
  const a=els[old], b=els[n];
  els.forEach((el,j)=>{ if(j!==old && j!==n){ el.classList.remove("on"); el.style.cssText=el.style.cssText.replace(/transform[^;]*;|transition[^;]*;|visibility[^;]*;/g,""); } });
  b.style.transition="none"; b.style.transform=`translateX(${dir*100}%)`; b.style.visibility="visible";
  void b.offsetWidth;
  b.style.transition=EASE; b.style.transform="translateX(0)"; b.classList.add("on");
  a.classList.remove("on"); a.style.transition=EASE; a.style.visibility="visible"; a.style.transform=`translateX(${-dir*100}%)`;
  clearTimeout(showSlide._t); showSlide._t=setTimeout(()=>{ [a,b].forEach(el=>{ el.style.transition=""; el.style.transform=""; el.style.visibility=""; }); }, 950);
  els.forEach((el,j)=>el.setAttribute("aria-hidden",String(j!==n)));
  document.querySelectorAll(".pillar").forEach((el,j)=>el.classList.toggle("on",j===n));
  document.querySelectorAll(".dots button").forEach((el,j)=>el.setAttribute("aria-pressed",String(j===n)));
}
S.slideHold = 0;
setInterval(()=>{ if(S.view==="home" && !S.sheet && Date.now()>S.slideHold && !document.hidden) showSlide(S.slide+1, 1); }, 3000);
})();
